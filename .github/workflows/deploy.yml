name: Deploy to EasyPanel

# Every push to main builds the image, pushes it to GitHub Container Registry,
# then calls EasyPanel's deploy webhook so it pulls the new tag.
#
# Required repository secrets:
#   EASYPANEL_WEBHOOK_URL  deploy webhook from EasyPanel (App → Deploy → Webhook)
#
# Optional:
#   EASYPANEL_API_TOKEN    only if you switch to the API-driven deploy below
#
# The image is published as ghcr.io/<owner>/<repo>:<sha> and :latest.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time; a newer push supersedes an in-flight one.
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The suite is the gate: a red test must never reach production.
      - run: npm test

  build-and-deploy:
    name: Build, push and deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Normalise image name
        id: image
        # GHCR requires a lowercase path; the repository owner may not be.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer cache survives between runs, so only changed layers rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger EasyPanel deploy
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::EASYPANEL_WEBHOOK_URL is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # EasyPanel answers 200 on acceptance. --fail makes curl exit non-zero
          # on 4xx/5xx so the job turns red instead of silently "succeeding".
          status=$(curl -sS --fail -o /tmp/easypanel.out -w '%{http_code}' \
            -X POST "$WEBHOOK")
          echo "EasyPanel responded HTTP $status"
          cat /tmp/easypanel.out || true
